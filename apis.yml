name: Gantto
description: >-
  Gantto was a web-based Gantt chart and project scheduling SaaS launched in August 2010, backed by Y Combinator
  and 500 Startups (500 Global). It let teams create and share project schedules in the browser as an alternative to
  Microsoft Project, with a customer base that reportedly included Twitter, Lucasfilm, and Fujitsu. Gantto was acquired
  by Dutch competitor Tom's Planner on July 9, 2013, and the product was subsequently discontinued, with users migrated
  to Tom's Planner. gantto.com now redirects to tomsplanner.com. This company is retained in the API Evangelist network
  as a historical portfolio-lead record; it publishes no developer program, API, or technical surface to enrich.
